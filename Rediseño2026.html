        // Functions
        function renderCards(filter = 'all') {
            const grid = document.getElementById('careers-grid');
            grid.innerHTML = ''; // Clear existing

            const filteredData = filter === 'all' 
                ? careersData 
                : careersData.filter(career => career.category === filter);

            filteredData.forEach(career => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-lg overflow-hidden card-hover border border-gray-100 flex flex-col h-full';
                
                // Color coding by faculty
                let headerColor = 'bg-gray-700';
                if(career.category === 'ingenieria') headerColor = 'bg-blue-600';
                if(career.category === 'empresariales') headerColor = 'bg-emerald-600';
                if(career.category === 'sociales') headerColor = 'bg-purple-600';

                card.innerHTML = `
                    <div class="${headerColor} p-4 text-white flex items-center justify-between">
                        <i class="fas ${career.icon} text-3xl opacity-80"></i>
                        <span class="text-xs font-bold uppercase tracking-wider bg-white bg-opacity-20 px-2 py-1 rounded">${getCategoryName(career.category)}</span>
                    </div>
                    <div class="p-6 flex-grow flex flex-col">
                        <h3 class="text-xl font-bold text-gray-800 mb-2">${career.title}</h3>
                        <p class="text-gray-600 text-sm mb-4 flex-grow">${career.shortDesc}</p>
                        
                        <div class="flex flex-wrap gap-2 mb-6">
                            ${career.tags.map(tag => `<span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded-full font-semibold border border-gray-200">${tag}</span>`).join('')}
                        </div>
                        
                        <button onclick="openModal('${career.id}')" class="w-full bg-white text-${headerColor.replace('bg-', '')} border border-current font-bold py-2 px-4 rounded hover:bg-gray-50 transition flex justify-center items-center gap-2 group">
                            Ver Detalles Completos
                            <i class="fas fa-arrow-right transform group-hover:translate-x-1 transition"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function getCategoryName(cat) {
            if(cat === 'ingenieria') return 'Ingeniería';
            if(cat === 'empresariales') return 'Empresariales';
            if(cat === 'sociales') return 'Sociales y Jurídicas';
            return 'General';
        }

        function filterCareers(category) {
            // Visual feedback on buttons
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => {
                btn.classList.remove('bg-gray-100', 'text-blue-700', 'ring-2', 'ring-blue-700', 'z-10');
                btn.classList.add('bg-white', 'text-gray-900');
            });
            
            const activeBtn = document.getElementById(`btn-${category === 'all' ? 'all' : category}`);
            activeBtn.classList.remove('bg-white', 'text-gray-900');
            activeBtn.classList.add('bg-gray-100', 'text-blue-700', 'ring-2', 'ring-blue-700', 'z-10');

            renderCards(category);
        }

        function openModal(id) {
            const data = careersData.find(c => c.id === id);
            if (!data) return;

            document.getElementById('modal-title').textContent = data.title;
            
            const contentDiv = document.getElementById('modal-content');
            
            // Build Modal HTML
            let html = `
                <section>
                    <h3 class="text-lg font-bold text-blue-900 mb-2 flex items-center"><i class="fas fa-search mr-2"></i>Análisis 2025</h3>
                    <p class="text-gray-700 leading-relaxed bg-blue-50 p-4 rounded-lg border-l-4 border-blue-500">${data.content.analysis}</p>
                </section>
                
                <section class="grid md:grid-cols-2 gap-6">
                    <div>
                        <h3 class="text-lg font-bold text-blue-900 mb-3 flex items-center"><i class="fas fa-star mr-2"></i>Fortalezas y Diferencias</h3>
                        <ul class="space-y-3">
                            ${data.content.strengths.map(s => `
                                <li class="bg-gray-50 p-3 rounded border border-gray-100">
                                    <strong class="text-gray-900 block text-sm">${s.title}</strong>
                                    <span class="text-gray-600 text-sm">${s.desc}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold text-blue-900 mb-3 flex items-center"><i class="fas fa-door-open mr-2"></i>Salidas Profesionales</h3>
                        <div class="bg-green-50 p-4 rounded-lg border border-green-100 text-green-900 font-medium">
                            ${data.content.outputs}
                        </div>
                        
                        <div class="mt-6">
                            <h3 class="text-lg font-bold text-blue-900 mb-3 flex items-center"><i class="fas fa-bullhorn mr-2"></i>Mensajes Clave (Spots)</h3>
                            <div class="space-y-2">
                                ${data.content.spots.map(spot => `
                                    <div class="border-l-4 border-purple-500 pl-3 py-1">
                                        <p class="text-xs font-bold text-purple-700 uppercase">${spot.title}</p>
                                        <p class="text-sm text-gray-600 italic">"${spot.text}"</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </section>
            `;

            contentDiv.innerHTML = html;
            
            const overlay = document.getElementById('modal-overlay');
            overlay.classList.remove('hidden');
            // Small delay to allow display:block to apply before opacity transition
            setTimeout(() => {
                overlay.querySelector('div').classList.remove('scale-95', 'opacity-0');
            }, 10);
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            // overlay.querySelector('div').classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 100); 
        }

        // Close modal on click outside
        document.getElementById('modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initialize
        renderCards('all');

    </script>
</body>

</html>
